spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/fitness-micro-user
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: https://eureka-server-a0ye.onrender.com/eureka/



server:
  port: ${PORT:8081}